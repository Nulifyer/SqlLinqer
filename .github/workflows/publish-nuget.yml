name: Publish NuGet packages

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  build:
    needs: validate
    name: Validate and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release version
        id: version
        shell: python
        run: |
          import json
          import os
          import re

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              release = json.load(event_file)["release"]
          tag = release["tag_name"]
          number = r"(?:0|[1-9][0-9]*)"
          identifier = r"(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          match = re.fullmatch(
              rf"v(?P<version>{number}\.{number}\.{number}(?:-(?P<prerelease>{identifier}(?:\.{identifier})*))?)",
              tag,
          )
          if not match:
              raise SystemExit("Release tags must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease, without build metadata.")
          if release["prerelease"] != bool(match["prerelease"]):
              raise SystemExit("The GitHub prerelease setting must match the version's prerelease suffix.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={match['version']}\n")
          print(f"Publishing SqlLinqer {match['version']}")

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Pack release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          for project in SqlLinqer/SQLLinqer.csproj SqlLinqer.Diagnostics/SqlLinqer.Diagnostics.csproj SqlLinqer.Extensions.DependencyInjection/SqlLinqer.Extensions.DependencyInjection.csproj; do
            dotnet pack "$project" -c Release --output artifacts \
              -p:Version="$RELEASE_VERSION" -p:GeneratePackageOnBuild=false -p:ContinuousIntegrationBuild=true
          done

      - name: Save package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-${{ steps.version.outputs.version }}
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish to nuget.org
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download validated package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-${{ needs.build.outputs.version }}
          path: artifacts

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Log in to NuGet with Trusted Publishing
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER || 'Nulifyer' }}

      - name: Push package
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for package in SqlLinqer SqlLinqer.Diagnostics SqlLinqer.Extensions.DependencyInjection; do
            dotnet nuget push "artifacts/$package.$RELEASE_VERSION.nupkg" \
              --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
