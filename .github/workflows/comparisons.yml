name: Library comparisons

on:
  pull_request:
    paths:
      - 'SqlLinqer.Comparisons/**'
      - 'SqlLinqer/**'
      - '.github/workflows/comparisons.yml'
  workflow_dispatch:
    inputs:
      measure:
        description: Collect repeated local SQLite measurements after correctness checks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Validate equivalent results and runner failures
        run: |
          python3 SqlLinqer.Comparisons/run.py --verify --output TestResults/comparisons-verify.json
          python3 SqlLinqer.Comparisons/check-runner.py
      - name: Collect repeated measurements
        if: github.event_name == 'workflow_dispatch' && inputs.measure
        run: python3 SqlLinqer.Comparisons/run.py --output TestResults/comparisons-sqlite.json
      - name: Save raw reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqlite-library-comparisons
          path: TestResults/comparisons-*.json
          if-no-files-found: ignore
