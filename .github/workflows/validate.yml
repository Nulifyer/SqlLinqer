name: Validate

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  local:
    name: Local, compatibility, and minimum SQLite checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build compatibility programs
        run: |
          dotnet build SqlLinqer.Tests.Net10 -c Release -p:GeneratePackageOnBuild=false
          dotnet build SqlLinqer.Tests.NetFramework48 -c Release -p:GeneratePackageOnBuild=false
      - name: Run local suites and runner checks
        run: |
          dotnet run --project SqlLinqer.Tests -c Release -p:GeneratePackageOnBuild=false
          python3 SqlLinqer.Tests/check-runner.py
      - name: Run adoption integration and HTTP checks
        run: |
          dotnet run --project SqlLinqer.Integrations.Tests -c Release -p:GeneratePackageOnBuild=false
          python3 samples/SqlLinqer.MinimalApi/check.py
      - name: Verify formatting
        run: |
          dotnet format whitespace SqlLinqer/SQLLinqer.csproj --verify-no-changes --no-restore
          dotnet format whitespace SqlLinqer.Tests/SqlLinqer.Tests.csproj --verify-no-changes --no-restore
          dotnet format whitespace SqlLinqer.Extensions.DependencyInjection/SqlLinqer.Extensions.DependencyInjection.csproj --verify-no-changes --no-restore
          dotnet format whitespace SqlLinqer.Diagnostics/SqlLinqer.Diagnostics.csproj --verify-no-changes --no-restore
          dotnet format whitespace SqlLinqer.Integrations.Tests/SqlLinqer.Integrations.Tests.csproj --verify-no-changes --no-restore
          dotnet format whitespace samples/SqlLinqer.MinimalApi/SqlLinqer.MinimalApi.csproj --verify-no-changes --no-restore
      - name: Validate minimum SQLite engine
        run: python3 SqlLinqer.Tests/Sqlite/validate-minimum.py

  live:
    name: PostgreSQL, MySQL, and SQL Server checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Run every suite with disposable databases
        run: bash TestDBs/test-containers.sh
      - name: Save database test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-test-logs
          path: /tmp/sqllinqer-tests.*.log*
          if-no-files-found: ignore
